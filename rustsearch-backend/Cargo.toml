[package]
name = "rustsearch-backend"
version = "0.1.8"
edition = "2021"
default-run = "rustsearch-backend"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tantivy = { version = "0.22", features = ["mmap", "stopwords"] }
tantivy-jieba = "0.11"
jieba-rs = "0.7"
notify = "6.1"
rusqlite = { version = "0.31", features = ["bundled"] }
lopdf = "0.32"
pdf-extract = "=0.7.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
calamine = "0.24"
rayon = "1.8"
encoding_rs = "0.8"
chardetng = "0.1"
ignore = "0.4"
zstd = "0.13"
scraper = "0.19"
chrono = "0.4"
regex = "1"
crossbeam-channel = "0.5"
tempfile = "3"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time"] }
rmcp = { version = "=3.5.1", features = ["transport-io", "client", "transport-child-process"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
