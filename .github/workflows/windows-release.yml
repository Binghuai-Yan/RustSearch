name: Windows build and release

on:
  push:
    branches: [main, mcp]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Reuse a successful build run after desktop-test or CI-only changes'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_run == ''
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure dependency cache
        run: '"RUSTSEARCH_DEPENDENCY_CACHE_DIR=$env:RUNNER_TEMP\RustSearch-Dependencies" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: RustSearch.Tauri/package-lock.json

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}\RustSearch-Dependencies\cargo\registry
            ${{ runner.temp }}\RustSearch-Dependencies\cargo\git
            ${{ runner.temp }}\RustSearch-Dependencies\nuget\packages
            ${{ runner.temp }}\RustSearch-Dependencies\ocr
          key: windows-deps-${{ hashFiles('rustsearch-backend/Cargo.lock', 'RustSearch.Tauri/src-tauri/Cargo.lock', '**/*.csproj') }}
          restore-keys: |
            windows-deps-

      - name: Check README images and release notes
        run: |
          ./scripts/check-readme-assets.ps1
          ./scripts/sync-version.ps1 -Check
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $notes = Join-Path 'docs/releases' "$env:GITHUB_REF_NAME.md"
            if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
              throw "Detailed release notes are required: $notes"
            }
            if ((Get-Content -LiteralPath $notes -Raw).Trim().Length -lt 200) {
              throw "Release notes are too short: $notes"
            }
          }

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rustsearch-backend/Cargo.toml --all -- --check

      - name: Check Rust lints
        env:
          RUSTSEARCH_DEPENDENCY_CACHE_DIR: ${{ runner.temp }}\RustSearch-Dependencies
        run: |
          . ./scripts/use-dependency-cache.ps1
          cargo clippy --manifest-path rustsearch-backend/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust backend
        env:
          RUSTSEARCH_DEPENDENCY_CACHE_DIR: ${{ runner.temp }}\RustSearch-Dependencies
        run: |
          . ./scripts/use-dependency-cache.ps1
          $env:RUSTSEARCH_OCR_RUNTIME_DIR = ./scripts/prepare-ocr-runtime.ps1
          cargo test --manifest-path rustsearch-backend/Cargo.toml --locked

      - name: Install Inno Setup
        if: github.event_name != 'pull_request'
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') -and
              -not (Test-Path 'C:\Program Files\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }

      - name: Build all three independent packages
        env:
          RUSTSEARCH_DEPENDENCY_CACHE_DIR: ${{ runner.temp }}\RustSearch-Dependencies
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $version) { throw "Tag version $tagVersion does not match VERSION $version" }
          }
          ./build.ps1 -Version $version -SkipTests -SkipUITests -SkipInstaller:($env:GITHUB_EVENT_NAME -eq 'pull_request')

      - name: Check Tauri and shared migration code
        run: |
          . ./scripts/use-dependency-cache.ps1
          cargo fmt --manifest-path RustSearch.Tauri/src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Tauri formatting failed' }
          cargo clippy --manifest-path RustSearch.Tauri/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Tauri lints failed' }
          npm --prefix RustSearch.Tauri test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          ./scripts/test-data-migration.ps1 -Backend ./dist/RustSearch-WinUI/Backend/rustsearch-backend.exe

      - name: Verify parity and packaged MCP servers
        run: |
          ./scripts/test-release-packages.ps1 -SkipInstaller:($env:GITHUB_EVENT_NAME -eq 'pull_request')
          foreach ($frontend in @('WinUI','WPF','Tauri')) {
            ./scripts/test-mcp.ps1 -Package "./dist/RustSearch-$frontend"
          }

      - name: Verify third-party notices
        env:
          RUSTSEARCH_DEPENDENCY_CACHE_DIR: ${{ runner.temp }}\RustSearch-Dependencies
        run: |
          . ./scripts/use-dependency-cache.ps1
          dotnet restore RustSearch.UI/RustSearch.UI.csproj
          if ($LASTEXITCODE -ne 0) { throw 'WPF dependency restore failed' }
          ./scripts/generate-third-party-notices.ps1 -Check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RustSearch-win-x64
          path: |
            dist/RustSearch-*-win-x64.zip
            dist/RustSearch-*-win-x64-setup.exe
            dist/RustSearch-*-release-set.json
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-diagnostics
          path: artifacts/
          if-no-files-found: ignore

  reuse:
    if: github.event_name == 'workflow_dispatch' && inputs.reuse_run != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the existing build and unchanged application sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.reuse_run }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > source-jobs.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/windows-release.yml'
          jobs = json.loads(Path('source-jobs.json').read_text())['jobs']
          assert any(j['name'] == 'windows' and j['conclusion'] == 'success' for j in jobs), 'Source build checks did not pass'
          changed = subprocess.check_output(['git', 'diff', '--name-only', run['head_sha'], os.environ['GITHUB_SHA']], text=True).splitlines()
          allowed = {'.github/workflows/windows-release.yml', 'scripts/test-winui.ps1', 'scripts/test-winui-features.ps1', 'scripts/test-winui-visual.ps1', 'scripts/test-ui.ps1'}
          unexpected = [p for p in changed if p not in allowed and not p.startswith('RustSearch.Tauri/tests/')]
          assert not unexpected, f'Application or build inputs changed; a fresh build is required: {unexpected}'
          print(f"Verified application sources match successful build {run['id']} at {run['head_sha']}")
          PY

      - uses: actions/download-artifact@v7.0.0
        with:
          name: RustSearch-win-x64
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run }}

      - name: Verify all six reused artifact digests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          manifest = json.loads(Path(f'dist/RustSearch-{version}-release-set.json').read_text(encoding='utf-8-sig'))
          assert manifest['version'] == version
          expected = {f'RustSearch-{version}-{f}-win-x64{s}' for f in ['WinUI', 'WPF', 'Tauri'] for s in ['.zip', '-setup.exe']}
          assert {a['file'] for a in manifest['artifacts']} == expected and len(manifest['artifacts']) == 6
          for artifact in manifest['artifacts']:
              assert hashlib.sha256(Path('dist', artifact['file']).read_bytes()).hexdigest().upper() == artifact['sha256']
          PY

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: RustSearch-win-x64
          path: dist/
          if-no-files-found: error

  desktop:
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.reuse.result == 'success') }}
    needs: [windows, reuse]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: RustSearch.Tauri/package-lock.json

      - uses: actions/download-artifact@v7.0.0
        with:
          name: RustSearch-win-x64
          path: dist

      - name: Extract and verify built packages
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          foreach ($frontend in @('WinUI','WPF','Tauri')) {
            Expand-Archive "dist/RustSearch-$version-$frontend-win-x64.zip" -DestinationPath "dist/RustSearch-$frontend"
          }
          ./scripts/test-release-packages.ps1 -SkipInstaller:($env:GITHUB_EVENT_NAME -eq 'pull_request')
          npm --prefix RustSearch.Tauri ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop test dependency install failed' }

      - name: Prepare WebView2 runtime
        run: |
          function Find-WebViewRuntime {
            $roots = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:ProgramFiles/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")
            foreach ($root in $roots) {
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root -Filter msedgewebview2.exe -File -Recurse
              }
            }
          }
          $runtime = Find-WebViewRuntime | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $runtime) {
            choco install webview2-runtime --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WebView2 runtime installation failed' }
            $runtime = Find-WebViewRuntime | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $runtime) { throw 'WebView2 runtime executable is unavailable' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$($runtime.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "WebView2 runtime: $($runtime.FullName) ($($runtime.VersionInfo.ProductVersion))"

      - name: Verify Tauri desktop
        run: |
          $env:RUSTSEARCH_TEST_TAURI = (Resolve-Path ./dist/RustSearch-Tauri/rustsearch-tauri.exe).Path
          node RustSearch.Tauri/tests/desktop.mjs
          if ($LASTEXITCODE -ne 0) {
            ./RustSearch.Tauri/tests/probe-startup.ps1 -Executable $env:RUSTSEARCH_TEST_TAURI
            throw 'Tauri desktop tests failed'
          }

      - name: Verify WinUI desktop
        run: |
          ./scripts/test-winui.ps1 -Executable ./dist/RustSearch-WinUI/RustSearch.WinUI.exe
          ./scripts/test-winui-features.ps1 -Executable ./dist/RustSearch-WinUI/RustSearch.WinUI.exe -SkipPointerInput

      - name: Verify WPF desktop
        run: ./scripts/test-ui.ps1 -Executable ./dist/RustSearch-WPF/RustSearch.UI.exe -Packaged

      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-diagnostics
          path: artifacts/
          if-no-files-found: ignore

  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success' && (needs.windows.result == 'success' || needs.reuse.result == 'success') }}
    needs: [windows, reuse, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v7.0.0
        with:
          name: RustSearch-win-x64
          path: dist

      - name: Verify complete release set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert os.environ['RELEASE_TAG'] == 'v' + version
          manifest = json.loads(Path(f'dist/RustSearch-{version}-release-set.json').read_text(encoding='utf-8-sig'))
          assert manifest['version'] == version
          expected = {f'RustSearch-{version}-{f}-win-x64{s}' for f in ['WinUI', 'WPF', 'Tauri'] for s in ['.zip', '-setup.exe']}
          assert {a['file'] for a in manifest['artifacts']} == expected
          assert len(manifest['artifacts']) == 6
          for artifact in manifest['artifacts']:
              assert hashlib.sha256(Path('dist', artifact['file']).read_bytes()).hexdigest().upper() == artifact['sha256']
          PY

      - name: Refuse to rewrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c "import json; assert json.load(open('release-state.json'))['isDraft'], 'This version is already public; create a new version tag.'"
          fi

      - name: Upload all packages to a draft release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/RustSearch-*-win-x64.zip
            dist/RustSearch-*-win-x64-setup.exe
            dist/RustSearch-*-release-set.json
          draft: true
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          test "$count" -eq 7
          gh release edit "$RELEASE_TAG" --draft=false
